<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三重限定城市運動場拍貼機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Noto Sans TC', 'sans-serif'],
                        'cursive': ['"Great Vibes"', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 1; background-color: white; }
            100% { opacity: 0; }
        }
        .flash-effect { animation: flash 0.5s ease-out; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--theme-accent-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-accent); }
        
        .no-select { -webkit-user-select: none; user-select: none; }
        .btn-active-scale:active { transform: scale(0.9); }
        body { touch-action: manipulation; }

        /* ── Theme CSS Variables ── */
        :root {
            --theme-bg: #faf5ff;
            --theme-page-bg: #ede9fe;       /* 頁面底色 */
            --theme-accent: #9333ea;         /* 主視覺色：按鈕、圖示 */
            --theme-accent-light: #d8b4fe;
            --theme-accent-pill: #ede9fe;
            --theme-dot: #d8b4fe;
            --theme-title-color: #9333ea;    /* 拍貼本體文字色、主 Logo 線條 */
            --theme-strip-bg: #faf5ff;
            
            /* 獨立控制標題與進度條的 CSS 變數 */
            --theme-page-title-color: #9333ea;
            --theme-progress-text-color: #9333ea;
            --theme-progress-bg-color: #ede9fe;

            /* 單獨限制 DECATHLON 圖示文字之顏色 */
            --theme-logo-accent-color: #3643ba;
        }

        /* ── Theme Swatch ── */
        .theme-swatch {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform .2s, border-color .2s;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .theme-swatch.active {
            border-color: #1a1a1a;
            transform: scale(1.15);
        }
        .theme-swatch-inner {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
        }
        .theme-swatch-top { flex: 1; }
        .theme-swatch-bottom { flex: 1; }

        /* ── Icon Category Buttons ── */
        .icon-cat-btn {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid var(--theme-accent-light);
            background: white;
            color: var(--theme-accent);
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .icon-cat-btn.active {
            background: var(--theme-accent);
            color: white;
            border-color: var(--theme-accent);
        }

        /* ── Filter & Camera buttons ── */
        .filter-btn { transition: all .15s; }
        .filter-btn.active {
            background: var(--theme-accent) !important;
            color: white !important;
        }

        #btn-capture {
            background: var(--theme-accent);
        }
        #btn-capture:hover {
            filter: brightness(0.9);
        }
        #capture-progress {
            border-color: var(--theme-accent-light);
        }
        #btn-generate {
            background: var(--theme-accent);
        }

        /* ── Strip texture via JS ── */
        .strip-texture { background-color: var(--theme-strip-bg); }
    </style>
</head>
<body class="min-h-screen text-gray-800 font-sans" style="background: var(--theme-page-bg);">

<div class="max-w-6xl mx-auto p-4 py-8">
    <!-- Header -->
    <header class="text-center mb-6">
        <!-- 標題顏色：已配置為專用的 page-title 顏色 -->
        <h1 class="text-3xl md:text-4xl font-bold mb-2 flex items-center justify-center gap-3" style="color: var(--theme-page-title-color);">
            <svg class="w-8 h-8 opacity-90" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            三重限定</br>城市運動場拍貼機
            <svg class="w-8 h-8 opacity-90" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </h1>
        <p class="text-gray-600">與親愛的家人留下美好瞬間吧！</p>
    </header>

    <div class="flex flex-col lg:flex-row gap-8 items-center lg:items-start justify-center">

        <!-- ══ Left Panel ══ -->
        <div class="w-full lg:w-[450px] flex flex-col gap-5 bg-white p-5 rounded-3xl shadow-xl border border-purple-100">

            <!-- Camera viewport -->
            <div class="relative w-full aspect-[4/3] bg-gray-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center bg-black">
                <video id="webcam" autoplay muted playsinline webkit-playsinline class="w-full h-full object-cover hidden"></video>
                <div id="filter-layer-1" class="absolute inset-0 pointer-events-none transition-colors duration-300"></div>
                <div id="filter-layer-2" class="absolute inset-0 pointer-events-none transition-colors duration-300"></div>
                <div id="camera-placeholder" class="text-gray-400 flex flex-col items-center">
                    <svg class="w-16 h-16 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <p>點選下方按鈕開啟相機</p>
                </div>
                <div id="countdown-overlay" class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-8xl font-bold hidden z-10 no-select">3</div>
                <div id="flash" class="absolute inset-0 pointer-events-none opacity-0 z-20"></div>
            </div>

            <!-- Start btn -->
            <button id="btn-start" class="w-full font-bold py-4 px-4 rounded-xl transition shadow-sm flex items-center justify-center gap-2 text-white" style="background: var(--theme-accent);">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                點我允許使用相機權限
            </button>

            <!-- Filter buttons -->
            <div id="filter-controls" class="grid grid-cols-8 gap-2 hidden mx-auto w-full max-w-[340px]">
                <button class="filter-btn active w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale text-white" data-filter="none">原圖</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="film">復古</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="beauty">粉嫩</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="texture">質感</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="polaroid">溫暖</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="cinematic">電影</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="hkmovie">懷舊</button>
                <button class="filter-btn w-full py-1.5 rounded-md text-xs font-bold shadow-sm transition btn-active-scale bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="bw">黑白</button>
            </div>

            <!-- Camera controls -->
            <div id="camera-main-controls" class="flex items-center justify-between px-6 py-2 hidden">
                <button id="btn-retake" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition disabled:opacity-30 disabled:pointer-events-none" disabled>
                    <div class="w-12 h-12 rounded-full border-2 border-current flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                    </div>
                    <span class="text-[10px] font-bold">重拍一次</span>
                </button>

                <div class="relative">
                    <!-- 🌟 1. 新增這個靜態外框（絕對定位，不會跟著按鈕縮小） -->
                    <div class="absolute inset-0 rounded-full" style="box-shadow: 0 0 0 8px var(--theme-page-bg); pointer-events: none;"></div>
    
                    <!-- 🌟 2. 移除按鈕身上的 style 屬性 -->
                    <button id="btn-capture" class="btn-active-scale w-20 h-20 text-white rounded-full flex items-center justify-center shadow-lg transition-colors duration-300 relative z-10">
                        <svg id="icon-camera" class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="2"></circle></svg>
                        <svg id="icon-check" class="w-12 h-12 hidden text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                    <div id="capture-progress" class="absolute -inset-2 rounded-full border-2 border-mom-purple-light opacity-30"></div>
                </div>

                <button id="btn-flip" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition">
                    <div class="w-12 h-12 rounded-full border-2 border-current flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 12l-3-3m3 3l3-3M17 8V20m0-12l3 3m-3-3l-3 3"></path></svg>
                    </div>
                    <span class="text-[10px] font-bold">切換鏡頭</span>
                </button>
            </div>

            <button id="btn-reset-all" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 px-4 rounded-xl transition text-xs hidden">重頭開始</button>
            
            <!-- 進度條膠囊：顏色與底色改由獨立變數設定 -->
            <div id="status-message" class="text-center text-sm font-bold p-3 rounded-lg hidden" style="color: var(--theme-progress-text-color); background: var(--theme-progress-bg-color);">相機準備好了！</div>

            <!-- ══ 主題設定面板 ══ -->
	    <div id="theme-controls" class="border-t border-gray-100 pt-4 hidden">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 text-center">🎨 拍貼主題</p>

                <!-- Background Color Swatches -->
                <p class="text-xs text-gray-400 mb-2 font-bold text-center">風格底色切換</p>
                <div class="flex gap-2 flex-wrap mb-4 justify-center" id="bg-swatches">
                    <!-- 由 JS 動態產生 -->
                </div>

                <!-- Icon Category -->
                <p class="text-xs text-gray-400 mb-2 font-bold  text-center">裝飾圖示組</p>
                <div class="flex gap-2 flex-wrap justify-center" id="icon-cat-btns">
                    <!-- 由 JS 動態產生 -->
                </div>
            </div>
        </div>

        <!-- ══ Right Panel: Photostrip ══ -->
        <div class="w-full lg:w-auto flex flex-col items-center pb-10">
            <div id="photostrip" class="w-[340px] h-[1020px] strip-texture p-4 shadow-xl relative border-2 border-white rounded-sm no-select">

                            <img id="photo-2" class="w-full h-full object-cover hidden relative z-10">
                        </div>
                        <div class="w-full aspect-[3/2] shadow-sm rounded-2xl overflow-hidden relative bg-gray-100">
                            <div class="absolute inset-0 flex items-center justify-center text-gray-300"><span class="text-4xl font-bold opacity-30">3</span></div>
                            <img id="photo-3" class="w-full h-full object-cover hidden relative z-10">
                        </div>
                        <div class="w-full aspect-[3/2] shadow-sm rounded-2xl overflow-hidden relative bg-gray-100">
                            <div class="absolute inset-0 flex items-center justify-center text-gray-300"><span class="text-4xl font-bold opacity-30">4</span></div>
                            <img id="photo-4" class="w-full h-full object-cover hidden relative z-10">
                        </div>
                    </div>

let currentBgTheme = JSON.parse(JSON.stringify(BG_THEMES[0])); // 深拷貝防止直接修改原預設
let currentIconSet = 'sport';

// ── Apply theme to CSS variables ──
function applyTheme(theme) {
    const root = document.documentElement;
    root.style.setProperty('--theme-bg',           theme.bg);
    root.style.setProperty('--theme-page-bg',      theme.pageBg);
    root.style.setProperty('--theme-accent',       theme.accent);
    root.style.setProperty('--theme-accent-light', theme.accentLight);
    root.style.setProperty('--theme-accent-pill',  theme.accentPill);
    root.style.setProperty('--theme-dot',          theme.dot);
    root.style.setProperty('--theme-title-color',  theme.titleColor);   // ← 拍貼內部標題、Logo 線條色
    root.style.setProperty('--theme-strip-bg',     theme.bg);
    
    // 套用全新抽離獨立控制的自訂顏色 CSS 變數
    root.style.setProperty('--theme-page-title-color',    theme.pageTitleColor);
    root.style.setProperty('--theme-progress-text-color', theme.progressTextColor);
    root.style.setProperty('--theme-progress-bg-color',   theme.progressBgColor);
    root.style.setProperty('--theme-logo-accent-color', theme.logoAccentColor);

    document.body.style.background = theme.pageBg;

    // Update photostrip background
    document.getElementById('photostrip').style.backgroundColor = theme.bg;
    rebuildStripPattern(theme);
    renderDecoIcons();
}

function rebuildStripPattern(theme) {
    const pc = document.createElement('canvas');
    pc.width = 20; pc.height = 20;
    const pctx = pc.getContext('2d');
    pctx.fillStyle = theme.bg;
    pctx.fillRect(0, 0, 20, 20);
    pctx.fillStyle = theme.dot;
    pctx.globalAlpha = 0.4;
    pctx.beginPath(); pctx.arc(10, 10, 1.5, 0, Math.PI * 2); pctx.fill();
    document.getElementById('photostrip').style.backgroundImage = `url(${pc.toDataURL('image/png')})`;
}

// ── Resolve fill color ──
function resolveFill(fill) {
    if (fill === 'VAR_ACCENT') return currentBgTheme.accent;
    if (fill === 'VAR_ACCENT_LIGHT') return currentBgTheme.accentLight;
    return fill;
}

// ── Render decorative icons onto the strip ──
function renderDecoIcons() {
    const layer = document.getElementById('deco-icons-layer');
    layer.innerHTML = '';
    const iconDefs = ICON_SETS[currentIconSet]?.icons || [];
    iconDefs.forEach(ic => {
        const wrapper = document.createElement('div');
        wrapper.style.position = 'absolute';
        wrapper.style.width = ic.size + 'px';
        wrapper.style.height = ic.size + 'px';
        wrapper.style.zIndex = '20';
        if (ic.top  !== undefined) wrapper.style.top   = ic.top  + 'px';
        if (ic.left !== undefined) wrapper.style.left  = ic.left + 'px';
        if (ic.right!== undefined) wrapper.style.right = ic.right + 'px';

        const fillColor = resolveFill(ic.fill);
        wrapper.innerHTML = `
            <svg width="100%" height="100%" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <g transform="rotate(${ic.rotate} 12 12)" opacity="${ic.opacity}">
                    <path fill="${fillColor}" d="${ic.path}"/>
                </g>
            </svg>`;
        layer.appendChild(wrapper);
    });
}

// ── Build BG swatches ──
function buildSwatches() {
    const container = document.getElementById('bg-swatches');
    container.innerHTML = '';
    BG_THEMES.forEach(theme => {
        const sw = document.createElement('div');
        sw.className = 'theme-swatch' + (theme.id === currentBgTheme.id ? ' active' : '');
        sw.title = theme.name;
        sw.innerHTML = `
            <div class="theme-swatch-inner">
                <div class="theme-swatch-top" style="background:${theme.swatchTop}"></div>
                <div class="theme-swatch-bottom" style="background:${theme.swatchBot}"></div>
            </div>`;
        sw.addEventListener('click', () => {
            currentBgTheme = JSON.parse(JSON.stringify(theme)); // 深拷貝
            document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
            applyTheme(currentBgTheme);
        });
        container.appendChild(sw);
    });
}

// ── Build icon category buttons ──
function buildIconCatBtns() {
    const container = document.getElementById('icon-cat-btns');
    container.innerHTML = '';
    Object.entries(ICON_SETS).forEach(([key, set]) => {
        const btn = document.createElement('button');
        btn.className = 'icon-cat-btn' + (key === currentIconSet ? ' active' : '');
        btn.textContent = set.name;
        btn.addEventListener('click', () => {
            currentIconSet = key;
            document.querySelectorAll('.icon-cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDecoIcons();
        });
        container.appendChild(btn);
    });
}

// ══════════════════════════════════════════════════════════════
// CAMERA LOGIC & EVENT BINDINGS
// ══════════════════════════════════════════════════════════════
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

document.addEventListener('DOMContentLoaded', () => {
    // Init theme UI
    buildSwatches();
    buildIconCatBtns();
    applyTheme(currentBgTheme);

    const video         = document.getElementById('webcam');
    const placeholder   = document.getElementById('camera-placeholder');
    const btnStart      = document.getElementById('btn-start');
    const btnCapture    = document.getElementById('btn-capture');
    const btnRetake     = document.getElementById('btn-retake');
    const btnFlip       = document.getElementById('btn-flip');
    const btnResetAll   = document.getElementById('btn-reset-all');
    const cameraControls= document.getElementById('camera-main-controls');
    const iconCamera    = document.getElementById('icon-camera');
    const iconCheck     = document.getElementById('icon-check');
    const captureProgress=document.getElementById('capture-progress');
    const countdownOverlay=document.getElementById('countdown-overlay');
    const flash         = document.getElementById('flash');
    const statusMsg     = document.getElementById('status-message');
    const dateText      = document.getElementById('current-date');
    const modal         = document.getElementById('result-modal');
    const finalImg      = document.getElementById('final-result-img');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const filterLayer1  = document.getElementById('filter-layer-1');
    const filterLayer2  = document.getElementById('filter-layer-2');
    const filterControls= document.getElementById('filter-controls');
    const themeControls = document.getElementById('theme-controls');
    const filterBtns    = document.querySelectorAll('.filter-btn');

    let stream = null, currentPhotoIndex = 0, isCountingDown = false;
    let facingMode = 'user', currentFilter = 'none';
    const TOTAL = 4;

    dateText.innerText = `VITAL SPORTS ${new Date().getFullYear()}`;

    // ── Clean & Re-engineered Filter Selection logic (已修正原圖按鈕卡色問題) ──
    filterBtns.forEach(btn => {
        btn.addEventListener('click', e => {
            // 重設所有濾鏡按鈕（移出 active 與白字，套回預設灰色，無 inline styles 殘留）
            filterBtns.forEach(b => {
                b.classList.remove('active', 'text-white');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            
            // 設定當前被點選按鈕
            const target = e.currentTarget;
            target.classList.remove('bg-gray-100', 'text-gray-600');
            target.classList.add('active', 'text-white');

            currentFilter = target.dataset.filter;
            video.style.filter = 'none';
            filterLayer1.style.backgroundColor = 'transparent';
            filterLayer2.style.backgroundColor = 'transparent';

            if (currentFilter === 'film') {
                filterLayer1.style.mixBlendMode = 'multiply';  filterLayer1.style.backgroundColor = 'rgba(255,170,80,0.2)';
                filterLayer2.style.mixBlendMode = 'screen';    filterLayer2.style.backgroundColor = 'rgba(40,40,40,0.15)';
            } else if (currentFilter === 'beauty') {
                video.style.filter = 'blur(0.5px)';
                filterLayer1.style.mixBlendMode = 'screen';    filterLayer1.style.backgroundColor = 'rgba(255,230,240,0.15)';
            } else if (currentFilter === 'texture') {
                filterLayer1.style.mixBlendMode = 'multiply';  filterLayer1.style.backgroundColor = 'rgba(10,30,55,0.25)';
                filterLayer2.style.mixBlendMode = 'overlay';   filterLayer2.style.backgroundColor = 'rgba(130,130,130,0.3)';
            } else if (currentFilter === 'polaroid') {
                filterLayer1.style.mixBlendMode = 'multiply';  filterLayer1.style.backgroundColor = 'rgba(255,200,150,0.2)';
                filterLayer2.style.mixBlendMode = 'screen';    filterLayer2.style.backgroundColor = 'rgba(50,20,60,0.25)';
            } else if (currentFilter === 'bw') {
                filterLayer1.style.mixBlendMode = 'color';     filterLayer1.style.backgroundColor = 'rgba(0,0,0,1)';
            } else if (currentFilter === 'cinematic') {
                filterLayer1.style.mixBlendMode = 'multiply';  filterLayer1.style.backgroundColor = 'rgba(0,40,80,0.35)';
                filterLayer2.style.mixBlendMode = 'overlay';   filterLayer2.style.backgroundColor = 'rgba(255,150,50,0.25)';
            } else if (currentFilter === 'hkmovie') {
                filterLayer1.style.mixBlendMode = 'multiply';  filterLayer1.style.backgroundColor = 'rgba(20,60,40,0.35)';
                filterLayer2.style.mixBlendMode = 'screen';    filterLayer2.style.backgroundColor = 'rgba(200,140,40,0.15)';
            }
        });
    });

    // ── Camera ──
    async function startCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
            video.srcObject = stream;
            video.style.transform = facingMode === 'user' ? 'scale(-1.02,1.02)' : 'scale(1.02,1.02)';
            video.onloadedmetadata = () => {
                video.play();
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                btnStart.classList.add('hidden');

		// 與濾鏡一樣，若存在就移除 hidden
    		if (filterControls) filterControls.classList.remove('hidden');
  		if (themeControls) themeControls.classList.remove('hidden'); // 🌟 新增這行

                cameraControls.classList.remove('hidden');
                btnResetAll.classList.remove('hidden');
                statusMsg.classList.remove('hidden');
                updateUI();
            };
        } catch(err) {
            alert('無法存取相機，請使用預設瀏覽器開啟或確認權限。');
        }
    }

    btnStart.addEventListener('click', startCamera);
    btnFlip.addEventListener('click', () => { facingMode = facingMode === 'user' ? 'environment' : 'user'; startCamera(); });

    btnRetake.addEventListener('click', async () => {
        if (currentPhotoIndex > 0 && !isCountingDown) {
            const wasMax = currentPhotoIndex === TOTAL;
            const img = document.getElementById(`photo-${currentPhotoIndex}`);
            img.src = ''; img.classList.add('hidden');
            currentPhotoIndex--;
            iconCamera.classList.remove('hidden');
            iconCheck.classList.add('hidden');
            btnCapture.style.background = currentBgTheme.accent;
            if (wasMax || video.classList.contains('hidden')) await startCamera();
            updateUI();
            statusMsg.innerText = `已移除上一張，準備重拍第 ${currentPhotoIndex + 1} 張。`;
        }
    });

    btnCapture.addEventListener('click', () => {
        if (currentPhotoIndex === TOTAL && !isCountingDown) { generateFinalImage(); return; }
        if (currentPhotoIndex >= TOTAL || isCountingDown) return;
        isCountingDown = true;
        btnCapture.disabled = btnRetake.disabled = btnFlip.disabled = true;
        let count = 3;
        countdownOverlay.innerText = count;
        countdownOverlay.classList.remove('hidden');
        const interval = setInterval(() => {
            count--;
            if (count > 0) { countdownOverlay.innerText = count; }
            else { clearInterval(interval); countdownOverlay.classList.add('hidden'); takePhoto(); }
        }, 1000);
    });

    function applyCanvasFilter(ctx, w, h, tempCanvas) {
        if (currentFilter === 'film') {
            ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(255,170,80,0.2)'; ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'screen';   ctx.fillStyle = 'rgba(40,40,40,0.15)';  ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'beauty') {
            ctx.globalAlpha = 0.4; ctx.drawImage(tempCanvas,-2,-2,w+4,h+4); ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = 'rgba(255,230,240,0.15)'; ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'texture') {
            ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(10,30,55,0.25)';  ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'overlay';  ctx.fillStyle = 'rgba(130,130,130,0.3)'; ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'polaroid') {
            ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(255,200,150,0.2)'; ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'screen';   ctx.fillStyle = 'rgba(50,20,60,0.25)';   ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'bw') {
            ctx.globalCompositeOperation = 'color';    ctx.fillStyle = 'rgba(0,0,0,1)';          ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'cinematic') {
            ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(0,40,80,0.35)';    ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'overlay';  ctx.fillStyle = 'rgba(255,150,50,0.25)'; ctx.fillRect(0,0,w,h);
        } else if (currentFilter === 'hkmovie') {
            ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(20,60,40,0.35)';   ctx.fillRect(0,0,w,h);
            ctx.globalCompositeOperation = 'screen';   ctx.fillStyle = 'rgba(200,140,40,0.15)'; ctx.fillRect(0,0,w,h);
        }
        ctx.globalCompositeOperation = 'source-over';
    }

    function takePhoto() {
        flash.classList.add('flash-effect');
        setTimeout(() => flash.classList.remove('flash-effect'), 500);

        const W = 900, H = 600;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

        const vr = video.videoWidth / video.videoHeight, tr = W / H;
        let sx, sy, sw, sh;
        if (vr > tr) { sh = video.videoHeight; sw = sh * tr; sx = (video.videoWidth - sw)/2; sy = 0; }
        else         { sw = video.videoWidth;  sh = sw / tr; sx = 0; sy = (video.videoHeight - sh)/2; }

        const tmp = document.createElement('canvas');
        tmp.width = W; tmp.height = H;
        const tc = tmp.getContext('2d');
        tc.fillStyle = '#ffffff'; tc.fillRect(0,0,W,H);
        if (facingMode === 'user') { tc.translate(W,0); tc.scale(-1,1); }
        tc.drawImage(video, Math.round(sx), Math.round(sy), Math.round(sw), Math.round(sh), 0, 0, W, H);

        ctx.drawImage(tmp, 0, 0);
        applyCanvasFilter(ctx, W, H, tmp);

        currentPhotoIndex++;
        const img = document.getElementById(`photo-${currentPhotoIndex}`);
        img.src = canvas.toDataURL('image/jpeg', 0.9);
        img.classList.remove('hidden');
        iconCamera.classList.add('hidden');
        iconCheck.classList.remove('hidden');
        btnCapture.style.background = '#10b981';

        if (currentPhotoIndex === TOTAL) {
            isCountingDown = false;
            btnCapture.disabled = btnRetake.disabled = btnFlip.disabled = false;
            updateUI();
            statusMsg.innerText = '拍攝完成！請按下按鈕產生圖片！';
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                video.classList.add('hidden');
                placeholder.innerHTML = '<p class="text-green-500 font-bold">拍攝完成！</p><p class="text-sm mt-2">點擊下方按鈕匯出</p>';
                placeholder.classList.remove('hidden');
            }
        } else {
            setTimeout(() => {
                isCountingDown = false;
                btnCapture.disabled = btnRetake.disabled = btnFlip.disabled = false;
                iconCamera.classList.remove('hidden');
                iconCheck.classList.add('hidden');
                btnCapture.style.background = currentBgTheme.accent;
                updateUI();
            }, 1500);
        }
    }

    function updateUI() {
        btnRetake.disabled = currentPhotoIndex === 0;
        const done = currentPhotoIndex === TOTAL;
        captureProgress.style.borderColor = done ? '#10b981' : currentBgTheme.pageBg;
        statusMsg.innerText = `進度：${currentPhotoIndex} / ${TOTAL}`;
    }

    btnResetAll.addEventListener('click', () => {
        currentPhotoIndex = 0;
        for (let i=1; i<=TOTAL; i++) { const img = document.getElementById(`photo-${i}`); img.src=''; img.classList.add('hidden'); }
        iconCamera.classList.remove('hidden');
        iconCheck.classList.add('hidden');
        btnCapture.style.background = currentBgTheme.accent;
        placeholder.innerHTML = '<svg class="w-16 h-16 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg><p>請先開啟相機</p>';
        startCamera();
    });

    async function generateFinalImage() {
        const orig = btnCapture.innerHTML;
        btnCapture.disabled = true;
        btnCapture.innerHTML = `<svg class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
        try {
            const strip = document.getElementById('photostrip');
            strip.style.backgroundColor = currentBgTheme.bg;
            const canvas = await html2canvas(strip, {
                scale: 2, useCORS: true, backgroundColor: currentBgTheme.bg, logging: false,
                onclone: clonedDoc => {
                    const content = clonedDoc.getElementById('photostrip-content');
                    if (content) { content.style.position = 'relative'; content.style.top = '-10pt'; }
                    const svg = clonedDoc.getElementById('uuid-f7229a9e-e1d3-4e6a-aeb4-0f8dc1be6467');
                    if (svg) { svg.style.position = 'relative'; svg.style.left = '0px'; }
                }
            });
            finalImg.src = canvas.toDataURL('image/jpeg', 0.95);
            modal.classList.remove('hidden'); modal.classList.add('flex');
        } catch(e) { 
            alert('匯出失敗，請重試。'); 
        } finally { 
            btnCapture.innerHTML = orig; 
            btnCapture.disabled = false; 
        }
    }

    btnCloseModal.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });
});
</script>
